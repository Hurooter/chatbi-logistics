server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：刷新 /chat 这类前端路由时，文件不存在就回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端请求 /api/xxx → 转给后端容器的 /xxx（末尾的 / 负责去掉 /api 前缀）
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # SSE 流式必须关缓冲，否则 nginx 会把 token 攒着不吐
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
