services:
  db:
    image: mysql:8.0
    container_name: chatbi-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - chatbi-db-data:/var/lib/mysql
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_users.sql:/docker-entrypoint-initdb.d/02_users.sql:ro
      - ./sql/03_conversations.sql:/docker-entrypoint-initdb.d/03_conversations.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  seed:
    image: chatbi-api:latest
    container_name: chatbi-seed
    depends_on:
      db:
        condition: service_healthy
    environment: &appenv
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    command: python scripts/seed.py
    restart: "no"

  api:
    build: .
    image: chatbi-api:latest
    container_name: chatbi-api
    depends_on:
      seed:
        condition: service_completed_successfully
    environment: *appenv
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build: ./web
    image: chatbi-web:latest
    container_name: chatbi-web
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  chatbi-db-data:
